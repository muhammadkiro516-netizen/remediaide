name: CI

on:
  push:
    branches: [main, cac/ml, feat/ml-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ml:
    name: ML (tes, lint, angka, rahasia)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan_secrets.py memeriksa seluruh riwayat git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Pasang paket (tanpa torch)
        run: pip install -e ".[dev,serve]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Pytest
        run: pytest -q
      - name: Setiap angka di README dan laporan punya sumber
        run: python scripts/check_numbers.py
      - name: Tidak ada token atau password di repo
        run: python scripts/scan_secrets.py

  web:
    name: Web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm test

  demo-notebook:
    name: Notebook demo 5 menit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jupyter nbconvert ipykernel
      - name: Jalankan 00_demo_cepat.ipynb dari awal sampai akhir
        working-directory: ml/notebooks
        run: jupyter nbconvert --to notebook --execute 00_demo_cepat.ipynb --output /tmp/out.ipynb --ExecutePreprocessor.timeout=600
