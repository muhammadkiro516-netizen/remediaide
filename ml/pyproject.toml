[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remediaide-ml"
version = "0.1.0"
description = "RemediAide 2.0 - multi-signal misconception diagnosis (CAC MLSC 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "lightgbm>=4.3",
  "optuna>=3.6",
  "shap>=0.45",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "tqdm>=4.66",
  "joblib>=1.3",
]

[project.optional-dependencies]
dl = [
  "torch>=2.2",
  "transformers>=4.44",
  "datasets>=2.20",
  "sentencepiece>=0.2",
  "sacremoses>=0.1",
  "accelerate>=0.33",
]
serve = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxmltools>=1.12",
  "skl2onnx>=1.17",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "jupyter>=1.0",
  "nbconvert>=7",
  "ipykernel>=6",
  "kaggle>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"src/remediaide_ml/**/*_card.py" = ["E501"]  # markdown table templates
"scripts/*.py" = ["E501"]  # CLI scripts: long Indonesian table labels / help strings
